# Place this at your Git repo root (same level as GradePointWeb). In Render: New → Blueprint.
services:
  - type: web
    name: gradepoint
    runtime: python
    rootDir: GradePointWeb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
